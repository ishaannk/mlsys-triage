    kv_blocks: 6000
    prefill_s_per_ktok: 0.004
    decode_s_per_tok: 0.006
  big:
    kind: local_gpu
    model_id: Qwen/Qwen2.5-32B-Instruct-AWQ
    served_model_name: big
